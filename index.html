<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --bg: #0a0a0d;
    --surface: #16161c;
    --surface-2: #1c1c23;
    --text: #f4f4f6;
    --muted: #a3a3ad;
    --subtle: #6d6d78;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.17);
    --accent: #8b5cf6;
    --accent-2: #ec4899;
    --mint: #10b981;
    --gold: #f59e0b;
    --radius: 18px;
    --radius-sm: 12px;
    --max-width: 1200px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
    overflow-x: hidden;

  .glow-field { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .glow { position: absolute; width: 760px; height: 760px; border-radius: 50%; filter: blur(150px); opacity: 0.16; animation: drift 18s ease-in-out infinite alternate; }
  .glow.g1 { background: var(--accent); top: -220px; left: -160px; }
  .glow.g2 { background: var(--accent-2); top: 30%; right: -280px; animation-delay: -6s; }
  .glow.g3 { background: #2563eb; bottom: -260px; left: 25%; animation-delay: -12s; }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(60px, -50px) scale(1.12); } }

  .report { position: relative; z-index: 1; max-width: var(--max-width); margin: 0 auto; padding: 56px 40px 90px; }
  .hero { padding: 44px 0 40px; border-bottom: 1px solid var(--line); }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 18px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 7px 14px;
    background: rgba(255, 255, 255, 0.03);
  }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

  .title .grad { background: linear-gradient(92deg, var(--accent) 0%, var(--accent-2) 60%, var(--gold) 120%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle { font-size: 23px; font-weight: 600; letter-spacing: -0.02em; color: #c7c7d1; line-height: 1.5; max-width: 820px; margin-bottom: 8px; }
  .subtitle2 { font-size: 15px; font-weight: 500; color: var(--subtle); margin-bottom: 26px; }
  .pillstat-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .pillstat { border: 1px solid var(--line-strong); border-radius: 999px; padding: 10px 18px; display: flex; align-items: baseline; gap: 8px; background: var(--surface); }
  .pillstat b { font-size: 17px; font-weight: 800; background: linear-gradient(92deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pillstat span { font-size: 12.5px; color: var(--muted); }

  .section { padding: 46px 0; border-bottom: 1px solid var(--line); }
  .section h2 { font-size: 29px; line-height: 1.25; margin: 0 0 8px; letter-spacing: -0.02em; font-weight: 700; }
  .section h2 .num { font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: 0.12em; display: block; margin-bottom: 8px; }
  .section-intro { color: var(--muted); max-width: 860px; margin: 0 0 26px; font-size: 15.5px; }
  .source-tag { display: inline-block; font-size: 12px; color: var(--subtle); margin-bottom: 22px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }

  .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .card {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 22px;
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--line-strong); box-shadow: 0 18px 44px rgba(0, 0, 0, 0.4); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 3px 9px; border-radius: 999px; background: rgba(16, 185, 129, 0.14); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
  .tag.violet { background: rgba(139, 92, 246, 0.16); color: #b6a2f7; border-color: rgba(139, 92, 246, 0.4); }
  .tag.pink { background: rgba(236, 72, 153, 0.16); color: #f4a4c9; border-color: rgba(236, 72, 153, 0.4); }
  .pill-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .insight { margin-top: 22px; padding: 16px 18px; border-left: 3px solid var(--accent); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; background: rgba(139, 92, 246, 0.1); font-size: 14.5px; color: #d5d5dd; }
  .insight strong { color: var(--text); }
  .note-box { margin-top: 16px; padding: 14px 16px; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); font-size: 13.5px; color: var(--muted); background: rgba(255, 255, 255, 0.02); }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .case-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 14px; }
  .list { margin: 0; padding-left: 18px; color: #c7c7d1; }
  .list li { margin-bottom: 9px; }
  .list li::marker { color: var(--accent); }

  /* rank list (hashtag ranking) */
  .rank-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .rank-row { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 16px; background: rgba(255, 255, 255, 0.02); }
  .rank-badge { flex: none; width: 40px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
  .rank-tag { font-weight: 700; font-size: 14.5px; color: var(--text); flex: 1; min-width: 160px; }
  .rank-stat { font-size: 12.5px; color: var(--muted); text-align: right; }

  .metric-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
  .metric-strip.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .metric-strip.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .metric-mini { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; background: rgba(255, 255, 255, 0.02); }
  .metric-mini.win { border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.09); }
  .metric-mini span { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .metric-mini strong { font-size: 21px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .metric-mini.win strong { color: #34d399; }
  .chart-card { padding-bottom: 16px; }
  .chart-wrap { position: relative; width: 100%; height: 340px; }
  .chart-wrap.tall { height: 420px; }
  .live-badge { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: #34d399; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; vertical-align: top; padding: 12px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  td { color: #c7c7d1; }

  /* product spotlight */
  .product-wrap { display: grid; grid-template-columns: 280px 1fr; gap: 30px; align-items: center; }
  .product-photo { border-radius: var(--radius); overflow: hidden; background: #f3f0ea; padding: 10px; }
  .product-photo img { width: 100%; display: block; border-radius: calc(var(--radius) - 8px); }
  @media (max-width: 780px) { .product-wrap { grid-template-columns: 1fr; } }

  /* content-type / proof cards with image */
  .media-card { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .media-card .media-photo { aspect-ratio: 4 / 5; overflow: hidden; background: #000; }
  .media-card .media-photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
  .media-card:hover .media-photo img { transform: scale(1.04); }
  .media-card .media-body { padding: 18px 20px 22px; }
  .media-card h3 { font-size: 17px; margin: 0 0 8px; font-weight: 700; }
  .media-card p { font-size: 13.5px; color: var(--muted); margin: 0; }

  .num-badge { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; margin-bottom: 12px; }

  .checklist { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
  .checklist li { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: #dcdce2; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .checklist li .box { flex: none; width: 16px; height: 16px; margin-top: 3px; border-radius: 5px; border: 2px solid var(--accent); }

  .proof-photo { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
  .proof-photo img { width: 100%; display: block; }

  /* gantt timeline */
  .gantt { padding: 8px 4px 0; }
  .gantt-rows { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 10px 0; margin-bottom: 10px; }
  .gantt-row {
    grid-row: auto; border-radius: 10px; padding: 11px 16px; display: flex; align-items: center; gap: 10px;
    font-size: 13.5px; font-weight: 700; color: #14161c; min-height: 42px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  }
  .gantt-row .gantt-flags { font-size: 14px; }
  .gantt-axis { display: grid; grid-template-columns: repeat(var(--cols), 1fr); border-top: 2px solid var(--mint); padding-top: 10px; }
  .gantt-axis span { font-size: 14px; font-weight: 800; color: var(--text); }
  @media (max-width: 780px) {
    .gantt-rows, .gantt-axis { grid-template-columns: 1fr; }
    .gantt-row { grid-column: auto !important; }
  }

  .quote-box {
    border: 1px solid transparent; border-radius: var(--radius); padding: 28px; font-size: 19px; line-height: 1.55; letter-spacing: -0.015em;
    background: linear-gradient(180deg, var(--surface), var(--surface-2)) padding-box, linear-gradient(135deg, rgba(139, 92, 246, .6), rgba(236, 72, 153, .6)) border-box;
    color: #e4e4ea;
  }
  .footer { font-size: 13px; color: var(--muted); line-height: 1.7; padding-top: 28px; }
  .footer a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line-strong); }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.in { opacity: 1; transform: none; }

  @media (max-width: 1024px) {
    .grid-4, .grid-3, .grid-2, .metric-strip.cols-4 { grid-template-columns: 1fr; }
    .title { font-size: 38px; }
    .subtitle { font-size: 18px; }
    .report { padding: 32px 20px 60px; }
    .chart-wrap { height: 300px; }
  }
</style>
</head>

  <script>
    /* ============ html helpers ============ */
    const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");

    let sectionNo = 0;
    const parts = [];
    const R = REPORT;

    /* hero */
    parts.push(
      '<section class="hero reveal">' +
      '<div class="eyebrow"><span class="live-dot"></span> ' + esc(R.hero.eyebrow) + "</div>" +
      '<h1 class="title">' + esc(R.hero.title) + "<br /><span class=\"grad\">" + esc(R.hero.subtitle) + "</span></h1>" +
      '<div class="subtitle2">' + esc(R.hero.subtitle2) + "</div>" +
      '<div class="pillstat-row">' +
      R.hero.pills.map((p) => '<div class="pillstat"><b>' + esc(p.value) + "</b><span>" + esc(p.label) + "</span></div>").join("") +
      "</div></section>"
    );

    /* 01 — Vietnam market verification */
    sectionNo++;
    (function () {
      const v = R.vietnam;
      parts.push(
        '<section class="section reveal">' +
        '<h2><span class="num">' + num2(sectionNo) + " — MARKET VERIFICATION</span>베트남 뷰티 카테고리 시장 검증</h2>" +
        '<div class="source-tag">' + esc(v.source) + "</div>" +
        '<div class="section-intro">' + esc(v.intro) + "</div>" +
        '<div class="grid-2">' +
        '<div class="card"><div class="case-title">최근 30일 인기 해시태그</div>' +
        '<div class="rank-list">' +
        v.hashtags.map((h) => '<div class="rank-row"><span class="rank-badge">' + esc(h.rank) + '</span><span class="rank-tag">' + esc(h.tag) + '</span><span class="rank-stat">' + esc(h.stat) + "</span></div>").join("") +
        "</div>" +
        '<div class="case-title" style="margin-top:22px;">성과가 좋은 크리에이티브 패턴</div>' +
        '<div class="pill-wrap">' + v.patterns.map((p) => '<span class="tag violet">' + esc(p) + "</span>").join("") + "</div>" +

        '<div class="card">' +
        '<div class="gantt" style="--cols:' + n + ';">' +
        '<div class="gantt-rows">' +
        t.rows.map((r) =>
          '<div class="gantt-row" style="grid-column:' + (r.start + 1) + " / " + (r.start + r.span + 1) + '; background:' + colorVar[r.color] + ';">' +

    /* ============ reveal on scroll ============ */
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) e.target.classList.add("in"); });
    }, { threshold: 0.12 });
    document.querySelectorAll(".reveal").forEach((el) => revealObserver.observe(el));
